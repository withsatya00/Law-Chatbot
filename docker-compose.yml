services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRESQL_URL: postgresql://${POSTGRES_USER:-legal_ai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-legal_ai}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mongo
      - postgres
      - redis
    volumes:
      - ./storage:/app/storage
      - hf_cache:/home/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/run_phase3_worker.py"]
    env_file:
      - .env
    environment:
      POSTGRESQL_URL: postgresql://${POSTGRES_USER:-legal_ai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-legal_ai}
    depends_on:
      - mongo
      - postgres
      - redis
    volumes:
      - ./storage:/app/storage
      - hf_cache:/home/app/.cache/huggingface
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api

  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

  # Transactional/user-owned Legal AI data: identities, chats, drafts,
  # document metadata, jobs and audit records. Mongo remains the RAG/vector
  # store; do not remove it until that subsystem is replaced separately.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_ai}
      POSTGRES_USER: ${POSTGRES_USER:-legal_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql/001_legal_ai_schema.sql:/docker-entrypoint-initdb.d/001_legal_ai_schema.sql:ro
      - ./database/postgresql/002_runtime_json_storage.sql:/docker-entrypoint-initdb.d/002_runtime_json_storage.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  postgres_data:
  redis_data:
  hf_cache:
