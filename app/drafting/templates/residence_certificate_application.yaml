draft_id: residence_certificate_application
name: Residence Certificate Application
hindi_name: निवास प्रमाण पत्र आवेदन
category: Application
description: >-
  An application to the Tehsildar/Revenue Officer requesting issuance of a
  residence (domicile) certificate.
authority_label: The Tehsildar / Revenue Officer,
applicable_acts_hint: []
applicable_sections_hint: []
drafting_notes: >-
  Format the information sought/requested as a clearly numbered list: the
  residence certificate requested, the period of residence at the current
  address, and the purpose it is needed for, using only the details given.
legal_enrichment_hints:
  - domicile certificate for admission/employment eligibility
trigger_phrases:
  - residence certificate application
  - residence certificate
  - domicile certificate
  - nivas praman patra
  - निवास प्रमाण पत्र आवेदन
  - निवास प्रमाण पत्र
required_fields:
  - key: applicant_name
    label: Applicant Name
    hindi_label: आवेदक का नाम
  - key: applicant_address
    label: Applicant Address
    hindi_label: आवेदक का पता
    field_type: textarea
  - key: applicant_mobile
    label: Mobile Number
    hindi_label: मोबाइल नंबर
    field_type: tel
  - key: information_sought
    label: Purpose of Certificate (list each point)
    hindi_label: प्रमाण पत्र का उद्देश्य (प्रत्येक बिंदु सूचीबद्ध करें)
    field_type: textarea
  - key: place
    label: Place
    hindi_label: स्थान
optional_fields:
  - key: applicant_age
    label: Age
    hindi_label: आयु
    field_type: number
    required: false
  - key: applicant_father_name
    label: Father's / Husband's Name
    hindi_label: पिता/पति का नाम
    help_text: "Rendered as S/o, D/o, W/o [name] -- whichever applies to you."
    required: false
  - key: applicant_email
    label: Email
    hindi_label: ईमेल
    field_type: email
    required: false
  - key: tenancy_start_date
    label: Residing Here Since (Date)
    hindi_label: यहाँ रह रहे हैं (तारीख से)
    field_type: date
    required: false
  - key: available_documents
    label: Available Documents / Evidence (ration card, voter ID, etc.)
    hindi_label: उपलब्ध दस्तावेज़/साक्ष्य
    field_type: textarea
    required: false
field_synonyms:
  place: place
