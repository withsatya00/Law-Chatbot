draft_id: scholarship_application
name: Scholarship Application
hindi_name: छात्रवृत्ति आवेदन
category: Application
advocate_register: false
description: >-
  An application to the Principal/Scholarship Committee requesting
  consideration for a scholarship.
authority_label: The Principal / Scholarship Committee,
applicable_acts_hint: []
applicable_sections_hint: []
drafting_notes: >-
  Format the information sought/requested as a clearly numbered list: the
  scholarship being applied for and the applicant's eligibility grounds
  (academic performance, financial need, category, etc.) using only the
  details given. Do not invent eligibility facts.
legal_enrichment_hints: []
trigger_phrases:
  - scholarship application
  - scholarship
  - chatravriti application
  - छात्रवृत्ति आवेदन
  - स्कॉलरशिप
required_fields:
  - key: applicant_name
    label: Student Name
    hindi_label: छात्र का नाम
  - key: student_class_roll
    label: Class / Roll Number / Course
    hindi_label: कक्षा / रोल नंबर / पाठ्यक्रम
  - key: applicant_mobile
    label: Mobile Number
    hindi_label: मोबाइल नंबर
    field_type: tel
  - key: information_sought
    label: Scholarship Sought and Eligibility Grounds (list each point)
    hindi_label: चाही गई छात्रवृत्ति और पात्रता आधार (प्रत्येक बिंदु सूचीबद्ध करें)
    field_type: textarea
  - key: place
    label: Place
    hindi_label: स्थान
optional_fields:
  - key: applicant_email
    label: Email
    hindi_label: ईमेल
    field_type: email
    required: false
  - key: bpl_status
    label: Below Poverty Line (fee exemption)?
    hindi_label: गरीबी रेखा से नीचे (शुल्क छूट)?
    required: false
  - key: available_documents
    label: Available Documents / Evidence (marksheet, income certificate, etc.)
    hindi_label: उपलब्ध दस्तावेज़/साक्ष्य
    field_type: textarea
    required: false
field_synonyms:
  class: student_class_roll
  roll number: student_class_roll
  place: place
