draft_id: birth_certificate_application
name: Birth Certificate Application
hindi_name: जन्म प्रमाण पत्र आवेदन
category: Application
description: >-
  An application to the Registrar of Births and Deaths requesting issuance
  of a birth certificate or correction of a delayed registration.
authority_label: The Registrar of Births and Deaths,
applicable_acts_hint:
  - Registration of Births and Deaths Act, 1969
applicable_sections_hint: []
drafting_notes: >-
  Format the information sought/requested as a clearly numbered list: the
  birth certificate requested, the child's/person's name, date and place of
  birth, and parents' names, using only the details given. Do not invent a
  date or place not stated.
legal_enrichment_hints:
  - delayed birth registration procedure
trigger_phrases:
  - birth certificate application
  - birth certificate
  - janm praman patra
  - जन्म प्रमाण पत्र आवेदन
  - जन्म प्रमाण पत्र
required_fields:
  - key: applicant_name
    label: Applicant Name (Parent / Guardian)
    hindi_label: आवेदक का नाम (माता-पिता / अभिभावक)
  - key: applicant_address
    label: Applicant Address
    hindi_label: आवेदक का पता
    field_type: textarea
  - key: applicant_mobile
    label: Mobile Number
    hindi_label: मोबाइल नंबर
    field_type: tel
  - key: child_name
    label: Name of Person Whose Birth Certificate Is Sought
    hindi_label: जिस व्यक्ति का जन्म प्रमाण पत्र चाहिए उसका नाम
  - key: incident_date
    label: Date of Birth
    hindi_label: जन्म तिथि
    field_type: date
  - key: incident_location
    label: Place of Birth
    hindi_label: जन्म स्थान
  - key: information_sought
    label: Purpose of Certificate (list each point)
    hindi_label: प्रमाण पत्र का उद्देश्य (प्रत्येक बिंदु सूचीबद्ध करें)
    field_type: textarea
  - key: place
    label: Place
    hindi_label: स्थान
optional_fields:
  - key: applicant_age
    label: Age
    hindi_label: आयु
    field_type: number
    required: false
  - key: applicant_father_name
    label: Father's / Husband's Name
    hindi_label: पिता/पति का नाम
    help_text: "Rendered as S/o, D/o, W/o [name] -- whichever applies to you."
    required: false
  - key: applicant_email
    label: Email
    hindi_label: ईमेल
    field_type: email
    required: false
  - key: available_documents
    label: Available Documents / Evidence (hospital slip, parents' ID, etc.)
    hindi_label: उपलब्ध दस्तावेज़/साक्ष्य
    field_type: textarea
    required: false
field_synonyms:
  child: child_name
  name: child_name
  date of birth: incident_date
  place of birth: incident_location
  place: place
