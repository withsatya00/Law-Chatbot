draft_id: cheque_bounce_notice
name: Cheque Bounce Notice
hindi_name: चेक बाउंस नोटिस
category: Notice
description: >-
  A statutory demand notice under Section 138 of the Negotiable Instruments
  Act, 1881, issued within 30 days of receiving the cheque return memo,
  demanding payment within 15 days before criminal proceedings can be
  initiated.
authority_label: "To,"
subject_template: "Statutory notice under Section 138, Negotiable Instruments Act, 1881 — dishonour of cheque no. {cheque_number}"
applicable_acts_hint:
  - Negotiable Instruments Act, 1881
applicable_sections_hint:
  - Section 138
  - Section 142
drafting_notes: >-
  This is a statutory notice under Section 138 of the Negotiable Instruments
  Act, 1881. It must state the cheque particulars precisely, demand payment
  of the cheque amount within 15 days of receipt of this notice, and state
  that failure to pay will result in a criminal complaint under Section 138
  read with Section 142 of the Act. Do not state or imply that the cheque was
  dishonoured for any reason other than what the applicant explicitly
  provided. If the date the return memo was received from the bank is
  available, state that this notice is being issued within the statutory
  thirty-day period from that date (proviso (b) to Section 138) -- using the
  supplied dishonour_date, never a computed or assumed date. Do not assert
  that the cheque was presented within its validity period or six months of
  the date it was drawn unless the applicant's own facts establish that.
legal_enrichment_hints:
  - statutory notice
  - financial liability
  - payment demand
# The fifteen-day payment period in this notice is not a choice -- it is
# proviso (c) to section 138 of the Negotiable Instruments Act, 1881, which
# is what makes the document a section 138 notice at all. Recorded here with
# its basis so `LegalDraftEngine` may state it without the sender having
# supplied it, which no other notice template may do.
statutory_response_period_days: 15
statutory_response_period_basis: >-
  Proviso (c) to section 138, Negotiable Instruments Act, 1881: the offence is
  complete only where the drawer fails to pay within fifteen days of receipt of
  the demand notice. Quotation and page evidence:
  tests/reference/negotiable_instruments_138_142.json (key: payment_opportunity).
  The demand notice must itself be sent within thirty days of the sender
  receiving the bank's information about the dishonour (proviso (b)).
# A section 138 notice must state that non-payment will be followed by a
# complaint under section 138 read with section 142 -- that statement is a
# statutory requirement of the notice, not a threat this tool added. Every
# other template stays subject to the `automatic_criminal_proceedings` rule.
permitted_statements:
  - automatic_criminal_proceedings
