draft_id: employment_noc_request
name: NOC Request (Employment)
hindi_name: अनापत्ति प्रमाण पत्र अनुरोध (रोजगार)
category: Application
advocate_register: false
description: >-
  An application to a current employer requesting a No Objection Certificate
  (NOC), such as for higher studies, a visa application, or a second job.
authority_label: The Human Resources Manager,
applicable_acts_hint: []
applicable_sections_hint: []
drafting_notes: >-
  Format the information sought/requested as a clearly numbered list: the
  NOC being requested and the purpose it is needed for, using only the
  details given. Do not invent a reason the applicant did not state.
legal_enrichment_hints: []
trigger_phrases:
  - noc request employment
  - employment noc
  - office noc
  - noc for higher studies
  - noc for visa
  - अनापत्ति प्रमाण पत्र अनुरोध
  - ऑफिस एनओसी
required_fields:
  - key: applicant_name
    label: Employee Name
    hindi_label: कर्मचारी का नाम
  - key: designation
    label: Designation
    hindi_label: पदनाम
  - key: applicant_mobile
    label: Mobile Number
    hindi_label: मोबाइल नंबर
    field_type: tel
  - key: information_sought
    label: NOC Requested For (list each point)
    hindi_label: किस हेतु एनओसी चाहिए (प्रत्येक बिंदु सूचीबद्ध करें)
    field_type: textarea
  - key: place
    label: Place
    hindi_label: स्थान
optional_fields:
  - key: applicant_email
    label: Email
    hindi_label: ईमेल
    field_type: email
    required: false
  - key: available_documents
    label: Available Documents / Evidence
    hindi_label: उपलब्ध दस्तावेज़/साक्ष्य
    field_type: textarea
    required: false
field_synonyms:
  position: designation
  post: designation
  place: place
