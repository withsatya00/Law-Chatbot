draft_id: consumer_notice
name: Consumer Notice
hindi_name: उपभोक्ता नोटिस
category: Notice
description: >-
  A pre-litigation legal notice to a seller/service provider regarding a
  defective product or deficient service, demanding replacement, refund, or
  compensation before approaching the Consumer Commission.
authority_label: "To,"
subject_template: "Legal notice regarding deficient service / defective product: {product_or_service}"
applicable_acts_hint:
  - Consumer Protection Act, 2019
applicable_sections_hint:
  - Section 2(11), Consumer Protection Act, 2019 (deficiency)
drafting_notes: >-
  State the product purchased or service availed, the defect/deficiency, and
  demand replacement, refund, or compensation within 15 days, failing which
  a complaint will be filed before the appropriate Consumer Disputes
  Redressal Commission, based strictly on the facts stated by the applicant.
legal_enrichment_hints:
  - deficiency in service
  - defective goods
  - consumer commission complaint as next step
trigger_phrases:
  - consumer notice
  - defective product notice
  - deficient service notice
  - consumer legal notice
  - उपभोक्ता नोटिस
  - खराब सामान नोटिस
required_fields:
  - key: applicant_name
    label: Applicant Name
    hindi_label: आवेदक का नाम
  - key: applicant_address
    label: Applicant Address
    hindi_label: आवेदक का पता
    field_type: textarea
  - key: applicant_mobile
    label: Mobile Number
    hindi_label: मोबाइल नंबर
    field_type: tel
  - key: respondent_name
    label: Seller / Service Provider Name
    hindi_label: विक्रेता / सेवा प्रदाता का नाम
  - key: respondent_address
    label: Seller / Service Provider Address
    hindi_label: विक्रेता / सेवा प्रदाता का पता
    field_type: textarea
  - key: product_or_service
    label: Product / Service Concerned
    hindi_label: संबंधित उत्पाद / सेवा
  - key: purchase_date
    label: Purchase / Service Date
    hindi_label: खरीद / सेवा तारीख
  - key: facts
    label: Facts of the Case / Nature of Defect or Deficiency (in your own words)
    hindi_label: मामले के तथ्य / दोष या कमी की प्रकृति (अपने शब्दों में)
    field_type: textarea
  - key: expected_relief
    label: Expected Relief / What you want
    hindi_label: अपेक्षित राहत
    field_type: textarea
  - key: place
    label: Place
    hindi_label: स्थान
optional_fields:
  - key: applicant_email
    label: Email
    hindi_label: ईमेल
    field_type: email
    required: false
  - key: amount_paid
    label: Amount Paid (Rs.)
    hindi_label: भुगतान की गई राशि (रु.)
    required: false
  - key: available_documents
    label: Available Documents / Evidence (invoice, warranty card, etc.)
    hindi_label: उपलब्ध दस्तावेज़/साक्ष्य
    field_type: textarea
    required: false
field_synonyms:
  seller: respondent_name
  product: product_or_service
  service: product_or_service
  purchase date: purchase_date
  amount: amount_paid
  place: place
