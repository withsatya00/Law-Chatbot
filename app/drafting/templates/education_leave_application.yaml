draft_id: education_leave_application
name: School / College Leave Application
hindi_name: विद्यालय / महाविद्यालय अवकाश आवेदन
category: Application
advocate_register: false
description: >-
  An application to the Principal/Head of Institution requesting leave of
  absence from school or college.
authority_label: The Principal,
applicable_acts_hint: []
applicable_sections_hint: []
drafting_notes: >-
  Format the information sought/requested as a clearly numbered list: the
  leave dates requested and the reason for leave, using only the details
  given. Do not invent a reason the applicant did not state.
legal_enrichment_hints: []
trigger_phrases:
  - leave application school
  - leave application college
  - school leave application
  - college leave application
  - chutti application
  - छुट्टी आवेदन
  - विद्यालय अवकाश आवेदन
required_fields:
  - key: applicant_name
    label: Student Name
    hindi_label: छात्र का नाम
  - key: student_class_roll
    label: Class / Roll Number / Course
    hindi_label: कक्षा / रोल नंबर / पाठ्यक्रम
  - key: applicant_mobile
    label: Parent / Guardian Mobile Number
    hindi_label: माता-पिता/अभिभावक का मोबाइल नंबर
    field_type: tel
  - key: information_sought
    label: Leave Dates and Reason (list each point)
    hindi_label: अवकाश की तारीखें और कारण (प्रत्येक बिंदु सूचीबद्ध करें)
    field_type: textarea
  - key: place
    label: Place
    hindi_label: स्थान
optional_fields:
  - key: applicant_email
    label: Email
    hindi_label: ईमेल
    field_type: email
    required: false
  - key: available_documents
    label: Available Documents / Evidence (medical certificate, etc.)
    hindi_label: उपलब्ध दस्तावेज़/साक्ष्य
    field_type: textarea
    required: false
field_synonyms:
  class: student_class_roll
  roll number: student_class_roll
  place: place
