draft_id: kyc_update_application
name: KYC Update Application
hindi_name: केवाईसी अद्यतन आवेदन
category: Application
description: >-
  An application to a bank requesting update of KYC (Know Your Customer)
  details such as address, mobile number, or identity documents on an
  existing account.
authority_label: The Branch Manager,
applicable_acts_hint:
  - Reserve Bank of India KYC Directions, 2016
applicable_sections_hint: []
drafting_notes: >-
  Format the information sought/requested as a clearly numbered list of the
  specific KYC details to be updated, listing the account number and the
  new details to be reflected. Do not request any update the applicant did
  not specify.
legal_enrichment_hints:
  - RBI periodic KYC update requirement
  - documents required for KYC update
trigger_phrases:
  - kyc update application
  - kyc update
  - update kyc
  - kyc form
  - केवाईसी अद्यतन आवेदन
  - केवाईसी अपडेट
required_fields:
  - key: applicant_name
    label: Applicant Name (Account Holder)
    hindi_label: आवेदक का नाम (खाताधारक)
  - key: applicant_address
    label: New / Current Address
    hindi_label: नया / वर्तमान पता
    field_type: textarea
  - key: applicant_mobile
    label: Mobile Number
    hindi_label: मोबाइल नंबर
    field_type: tel
  - key: bank_name
    label: Bank Name and Branch
    hindi_label: बैंक का नाम और शाखा
  - key: account_number
    label: Account Number
    hindi_label: खाता संख्या
  - key: information_sought
    label: KYC Details to be Updated (list each point)
    hindi_label: अद्यतन किए जाने वाले केवाईसी विवरण (प्रत्येक बिंदु सूचीबद्ध करें)
    field_type: textarea
  - key: place
    label: Place
    hindi_label: स्थान
optional_fields:
  - key: applicant_age
    label: Age
    hindi_label: आयु
    field_type: number
    required: false
  - key: applicant_father_name
    label: Father's / Husband's Name
    hindi_label: पिता/पति का नाम
    help_text: "Rendered as S/o, D/o, W/o [name] -- whichever applies to you."
    required: false
  - key: applicant_email
    label: Email
    hindi_label: ईमेल
    field_type: email
    required: false
  - key: available_documents
    label: Available Documents / Evidence (Aadhaar, PAN, address proof, etc.)
    hindi_label: उपलब्ध दस्तावेज़/साक्ष्य
    field_type: textarea
    required: false
field_synonyms:
  bank: bank_name
  account number: account_number
  account: account_number
  place: place
