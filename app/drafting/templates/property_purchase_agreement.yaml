draft_id: property_purchase_agreement
name: Property Purchase Agreement
hindi_name: संपत्ति क्रय अनुबंध
category: Contract
description: >-
  An agreement to purchase (agreement to sell) immovable property between a
  buyer and seller, setting out the sale consideration, payment schedule,
  and conditions of sale ahead of the final sale deed/registration.
authority_label: "N/A — agreement between the parties named below."
subject_template: "Agreement to Purchase property at {property_address}"
applicable_acts_hint:
  - Transfer of Property Act, 1882
  - Registration Act, 1908
  - Real Estate (Regulation and Development) Act, 2016
applicable_sections_hint: []
drafting_notes: >-
  Draft an agreement to sell between the seller (Party of the First Part)
  and buyer/purchaser (Party of the Second Part) covering the property, sale
  consideration, payment schedule, and the terms/conditions given, based
  strictly on the facts stated. Note that the actual transfer of title
  requires a registered sale deed executed after this agreement.
legal_enrichment_hints:
  - agreement to sell versus registered sale deed
  - earnest money/advance payment
  - clear and marketable title
trigger_phrases:
  - property purchase agreement
  - agreement to purchase property
  - property buy agreement
  - sampatti kray anubandh
  - संपत्ति क्रय अनुबंध
  - जमीन खरीद अनुबंध
required_fields:
  - key: party_a_name
    label: Seller Name
    hindi_label: विक्रेता का नाम
  - key: party_a_address
    label: Seller Address
    hindi_label: विक्रेता का पता
    field_type: textarea
  - key: party_b_name
    label: Buyer Name
    hindi_label: क्रेता का नाम
  - key: party_b_address
    label: Buyer Address
    hindi_label: क्रेता का पता
    field_type: textarea
  - key: property_address
    label: Property Address / Description
    hindi_label: संपत्ति का पता / विवरण
    field_type: textarea
  - key: sale_consideration_amount
    label: Total Sale Consideration (Rs.)
    hindi_label: कुल विक्रय प्रतिफल (रु.)
    # Security finding D1: guarantees this figure is never silently dropped
    # (LLM path or deterministic-timeout fallback alike).
    must_appear_verbatim: true
  - key: terms
    label: Terms and Conditions / Payment Schedule (in your own words)
    hindi_label: नियम और शर्तें / भुगतान अनुसूची (अपने शब्दों में)
    field_type: textarea
  - key: place
    label: Place
    hindi_label: स्थान
optional_fields:
  - key: term_duration
    label: Timeline to Complete Sale
    hindi_label: बिक्री पूरी करने की समयसीमा
    required: false
  - key: governing_law_state
    label: Governing State/Jurisdiction
    hindi_label: शासी राज्य/क्षेत्राधिकार
    required: false
field_synonyms:
  seller: party_a_name
  buyer: party_b_name
  property: property_address
  consideration: sale_consideration_amount
  sale price: sale_consideration_amount
  place: place
