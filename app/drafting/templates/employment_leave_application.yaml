draft_id: employment_leave_application
name: Employee Leave Application
hindi_name: कर्मचारी अवकाश आवेदन
category: Application
advocate_register: false
description: >-
  An application to an employer requesting leave of absence from work.
authority_label: The Human Resources Manager,
applicable_acts_hint: []
applicable_sections_hint: []
drafting_notes: >-
  Format the information sought/requested as a clearly numbered list: the
  leave dates requested and the reason for leave, using only the details
  given. Do not invent a reason the applicant did not state.
legal_enrichment_hints: []
trigger_phrases:
  - employee leave application
  - office leave application
  - leave application for office
  - office chutti application
  - कर्मचारी अवकाश आवेदन
  - ऑफिस छुट्टी आवेदन
required_fields:
  - key: applicant_name
    label: Employee Name
    hindi_label: कर्मचारी का नाम
  - key: designation
    label: Designation
    hindi_label: पदनाम
  - key: applicant_mobile
    label: Mobile Number
    hindi_label: मोबाइल नंबर
    field_type: tel
  - key: information_sought
    label: Leave Dates and Reason (list each point)
    hindi_label: अवकाश की तारीखें और कारण (प्रत्येक बिंदु सूचीबद्ध करें)
    field_type: textarea
  - key: place
    label: Place
    hindi_label: स्थान
optional_fields:
  - key: applicant_email
    label: Email
    hindi_label: ईमेल
    field_type: email
    required: false
  - key: available_documents
    label: Available Documents / Evidence (medical certificate, etc.)
    hindi_label: उपलब्ध दस्तावेज़/साक्ष्य
    field_type: textarea
    required: false
field_synonyms:
  position: designation
  post: designation
  place: place
