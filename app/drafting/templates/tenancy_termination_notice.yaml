    hindi_label: मोबाइल नंबर
    field_type: tel
  - key: respondent_name
    label: Tenant Name
    hindi_label: किरायेदार का नाम
  - key: rented_premises_address
    label: Rented Premises Address
    hindi_label: किराए की संपत्ति का पता
    field_type: textarea
  - key: facts
    label: Facts of the Case / Reason for Termination (in your own words)
    hindi_label: मामले के तथ्य / समाप्ति का कारण (अपने शब्दों में)
    field_type: textarea
  - key: place
    label: Place
    hindi_label: स्थान
optional_fields:
