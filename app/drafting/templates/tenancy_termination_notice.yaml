draft_id: tenancy_termination_notice
name: Tenancy Termination Notice
hindi_name: किरायेदारी समाप्ति नोटिस
category: Notice
description: >-
  A legal notice terminating a tenancy and requesting the tenant to vacate
  and hand over peaceful possession of the rented premises by a stated date.
authority_label: "To,"
subject_template: "Notice terminating tenancy of premises at {rented_premises_address}"
applicable_acts_hint:
  - Transfer of Property Act, 1882
  - Model Tenancy Act, 2021
# Section 106 sets the DEFAULT notice period for a lease of immovable
# property with no other duration agreed (15 days for month-to-month,
# ending with the tenancy month) -- a real, citable provision, confirmed via
# research. Deliberately NOT used to set a default
# `statutory_response_period_days`/`_basis` on this template: which period
# actually governs depends on the tenancy's own terms and the applicable
# State Rent Control Act (commonly 30-90 days), so asserting one fixed
# number here would risk being wrong for most real leases. Citing the
# section is safe; assuming its default period is not.
applicable_sections_hint:
  - Section 106, Transfer of Property Act, 1882
drafting_notes: >-
  State the tenancy details (premises, start date, rent), the ground for
  termination if given, and direct the tenant to vacate and hand over
  peaceful possession within the notice period stated (or 30 days if none
  given), failing which eviction proceedings will be initiated, based
  strictly on the facts stated by the applicant.
legal_enrichment_hints:
  - notice period for termination of tenancy
  - eviction proceedings as next step
trigger_phrases:
  - tenancy termination notice
  - eviction notice
  - vacate notice
  - tenant ko nikalna hai
  - किरायेदारी समाप्ति नोटिस
  - मकान खाली करने का नोटिस
required_fields:
