draft_id: threat_complaint
name: Threat Complaint
hindi_name: धमकी शिकायत
category: Complaint
description: >-
  A written complaint to the Station House Officer reporting a criminal
  threat/intimidation and requesting appropriate police action and
  protection.
authority_label: The Station House Officer,
subject_template: "Complaint regarding criminal intimidation/threat by {accused_details}"
applicable_acts_hint:
  - Bharatiya Nyaya Sanhita, 2023
  - Bharatiya Nagarik Suraksha Sanhita, 2023
applicable_sections_hint:
  - Section 351 BNS (criminal intimidation)
  - Section 173 BNSS
drafting_notes: >-
  Request the Station House Officer to take the complaint on record and take
  appropriate action to ensure the applicant's safety, based strictly on the
  facts, mode of threat, and evidence stated by the applicant. Do NOT assert
  or assume that an FIR will or must be registered -- ordinary criminal
  intimidation (BNS s.351(2)) is classified non-cognizable under the BNSS
  First Schedule, and the police may lawfully record it only as a
  non-cognizable report (BNSS s.174) rather than an FIR unless the facts
  actually stated by the applicant show the aggravated form (s.351(3):
  threat of death, grievous hurt, arson, or imputing unchastity), which is
  cognizable. Whether the offence is cognizable on these facts, and whether
  an FIR follows, is for the police to determine -- this document requests
  registration only if the user's own relief says so, and never states that
  outcome as certain.
legal_enrichment_hints:
  - criminal intimidation
  - personal safety and protection
  - evidence of threat (messages, calls, witnesses)
trigger_phrases:
  - threat complaint
  - threatening me
  - criminal intimidation complaint
  - dhamki complaint
  - mujhe dhamki di
  - मुझे धमकी दी गई
  - धमकी शिकायत
