draft_id: address_affidavit
name: Address Affidavit
hindi_name: पता शपथपत्र
category: Affidavit
description: >-
  A sworn affidavit declaring the deponent's current residential address,
  for submission as address proof where a standard document is unavailable.
authority_label: "Before the Notary Public / Competent Authority,"
applicable_acts_hint:
  - Bharatiya Sakshya Adhiniyam, 2023
applicable_sections_hint: []
drafting_notes: >-
  State the deponent's current residential address and, if given, the
  period of residence and reason a standard address proof is unavailable,
  numbered as separate paragraphs ('I say that...'). Never add, embellish,
  or infer any fact the deponent did not state. End with the standard
  verification clause.
legal_enrichment_hints:
  - proof of residence where standard documents unavailable
trigger_phrases:
  - address affidavit
  - address proof affidavit
  - pata shapath patra
  - address ka affidavit
  - पता शपथपत्र
required_fields:
  - key: applicant_name
    label: Applicant Name
    hindi_label: आवेदक का नाम
  - key: applicant_address
    label: Current Residential Address
    hindi_label: वर्तमान आवासीय पता
    field_type: textarea
  - key: affidavit_purpose
    label: Purpose of Affidavit
    hindi_label: शपथपत्र का उद्देश्य
    help_text: E.g. school admission, bank KYC, government scheme.
  - key: facts
    label: Facts of the Case (in your own words)
    hindi_label: मामले के तथ्य (अपने शब्दों में)
    field_type: textarea
  - key: place
    label: Place
    hindi_label: स्थान
optional_fields:
  - key: applicant_father_name
    label: Father's / Husband's Name
    hindi_label: पिता/पति का नाम
    required: false
  - key: deponent_age
    label: Age
    hindi_label: आयु
    field_type: number
    required: false
  - key: tenancy_start_date
    label: Residing Here Since (Date)
    hindi_label: यहाँ रह रहे हैं (तारीख से)
    field_type: date
    required: false
  - key: available_documents
    label: Available Documents / Evidence
    hindi_label: उपलब्ध दस्तावेज़/साक्ष्य
    field_type: textarea
    required: false
field_synonyms:
  purpose: affidavit_purpose
  place: place
  address: applicant_address
