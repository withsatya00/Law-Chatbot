    field_type: date
    required: false
  - key: witnesses
    label: Witnesses (if any)
    hindi_label: गवाह (यदि कोई हो)
    field_type: textarea
    required: false
  - key: available_documents
    label: Available Documents / Evidence (screenshots, recordings, etc.)
    hindi_label: उपलब्ध दस्तावेज़/साक्ष्य
    field_type: textarea
    required: false
field_synonyms:
  respondent: respondent_name
  date: incident_date
  witness: witnesses
  place: place
