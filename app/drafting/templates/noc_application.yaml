draft_id: noc_application
name: NOC Application (Banking)
hindi_name: अनापत्ति प्रमाण पत्र आवेदन (बैंकिंग)
category: Application
description: >-
  An application to a bank requesting a No Objection Certificate (NOC), such
  as after full repayment of a loan or closure of a facility.
authority_label: The Branch Manager,
applicable_acts_hint: []
applicable_sections_hint: []
drafting_notes: >-
  Format the information sought/requested as a clearly numbered list: the
  loan/facility account concerned and the NOC being requested, stating that
  all dues have been cleared if given. Do not invent a repayment fact the
  applicant did not state.
legal_enrichment_hints:
  - NOC required for loan closure/collateral release
trigger_phrases:
  - noc application
  - no objection certificate
  - bank noc
  - loan noc
  - अनापत्ति प्रमाण पत्र आवेदन
  - एनओसी
required_fields:
  - key: applicant_name
    label: Applicant Name
    hindi_label: आवेदक का नाम
  - key: applicant_address
    label: Applicant Address
    hindi_label: आवेदक का पता
    field_type: textarea
  - key: applicant_mobile
    label: Mobile Number
    hindi_label: मोबाइल नंबर
    field_type: tel
  - key: bank_name
    label: Bank Name and Branch
    hindi_label: बैंक का नाम और शाखा
  - key: account_number
    label: Loan / Account Number
    hindi_label: ऋण / खाता संख्या
  - key: information_sought
    label: NOC Requested For (list each point)
    hindi_label: किस हेतु एनओसी चाहिए (प्रत्येक बिंदु सूचीबद्ध करें)
    field_type: textarea
  - key: place
    label: Place
    hindi_label: स्थान
optional_fields:
  - key: applicant_age
    label: Age
    hindi_label: आयु
    field_type: number
    required: false
  - key: applicant_father_name
    label: Father's / Husband's Name
    hindi_label: पिता/पति का नाम
    help_text: "Rendered as S/o, D/o, W/o [name] -- whichever applies to you."
    required: false
  - key: applicant_email
    label: Email
    hindi_label: ईमेल
    field_type: email
    required: false
  - key: available_documents
    label: Available Documents / Evidence (repayment receipts, statement, etc.)
    hindi_label: उपलब्ध दस्तावेज़/साक्ष्य
    field_type: textarea
    required: false
field_synonyms:
  bank: bank_name
  account number: account_number
  loan number: account_number
  place: place
