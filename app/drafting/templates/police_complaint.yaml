draft_id: police_complaint
name: Police Complaint (Application to SHO)
hindi_name: पुलिस शिकायत (थाना प्रभारी को आवेदन)
category: Complaint
description: >-
  A written complaint/application to the Station House Officer requesting
  registration of an FIR or appropriate police action.
authority_label: The Station House Officer,
subject_template: "Application for registration of FIR / appropriate police action"
applicable_acts_hint:
  - Bharatiya Nagarik Suraksha Sanhita, 2023
applicable_sections_hint:
  - Section 173
drafting_notes: >-
  Request the Station House Officer to register the complaint, investigate,
  and take appropriate legal action under the applicable law, based strictly
  on the facts, witnesses, and evidence stated by the applicant. Do not name
  any accused or allege any offence beyond what the applicant has stated.
  The Prayer's registration request should use the real Indian convention
  for this document: request that "an FIR be registered under Section 173
  of the Bharatiya Nagarik Suraksha Sanhita, 2023" (naming that specific
  section, since it is the actual provision governing registration of
  information in a cognizable case) rather than a generic "take action"
  request, provided the facts as narrated describe a cognizable matter; if
  they do not clearly do so, request registration/appropriate action without
  asserting the cognizable classification.
legal_enrichment_hints:
  - investigation request
  - police responsibility
  - public safety
  - protection of the complainant
trigger_phrases:
  - police complaint
  - fir
  - fir draft
  - thana shikayat
  - police complaint banana hai
  - complaint to sho
  - station house officer
  - पुलिस शिकायत
