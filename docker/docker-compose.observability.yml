# Optional overlay adding Prometheus + Grafana on top of the main stack.
# Usage: docker compose -f docker-compose.yml -f docker/docker-compose.observability.yml up
#
# Prometheus scrapes the API's unauthenticated `/internal/metrics` (see
# app/main.py) over the internal Compose network only -- neither service here
# publishes a port to the host by default; uncomment the `ports:` blocks
# below if you want to reach Grafana/Prometheus directly from the host
# during local setup. Never publish `/internal/metrics` itself outside this
# network in a real deployment.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # ports:
    #   - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set a Grafana admin password}
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
